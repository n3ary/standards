name: '[check] PR validation (on PR)'

on:
  pull_request:
    branches: [main]

# Shared base PR-validation lives in n3ary/actions. This repo IS
# the source of n3ary/standards, so it does not vendor them -
# enable-drift-check stays false.

permissions:
  contents: read

jobs:
  shared:
    uses: n3ary/actions/.github/workflows/pr-check.yml@v23
    with:
      enable-drift-check: false